<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="extra.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <a class="brand-mark" href="index.html" aria-label="Entrelinhas, página inicial"><img src="/marca/raposa.png" alt="" width="56" height="56"></a>
    <h1><a href="index.html" style="color:inherit;text-decoration:none">ENTRE<b>LINHAS</b></a></h1>
    <p class="tagline">Coletivo de Escritores Independentes</p>
  </div>

    <a class="tab" href="index.html#lancamentos">Lançamentos</a>
    <a class="tab" href="index.html#projetos">Projetos</a>
    <a class="tab" href="index.html#servicos">Serviços</a>
    <a class="tab" href="autores.html">Autores</a>
  </nav>
</header>

<main id="root"><section class="page active"><p class="muted-note">Carregando...</p></section></main>

<footer class="site-footer">
  <div class="f-links">
    <a href="#" class="to-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Voltar ao topo &#8593;</a>
    <a href="conta.html">Minha conta</a>
  </div>

  <p>© 2026 Coletivo Entrelinhas</p>
</footer>

<script src="common.js"></script>
<script src="reviews.js"></script>
<script type="module">
// Leitura publica de uma obra publicada no Estudio.
//   ler.html?a=autor&o=obra       -> capa, sinopse e sumario
//   ler.html?a=autor&o=obra&c=3   -> capitulo 3 (anterior / proximo)
import { renderizar } from './vendor/estudio-leitura.js';

const { esc, imgUrl, api } = window.EL;
const root = document.getElementById('root');
const q = new URLSearchParams(location.search);
const autor = q.get('a') || '', obra = q.get('o') || '', cap = Number(q.get('c')) || 0;
const base = `ler.html?a=${encodeURIComponent(autor)}&o=${encodeURIComponent(obra)}`;
const milhar = (n) => Number(n || 0).toLocaleString('pt-BR');
const msg = (t) => { root.innerHTML = `<section class="page active"><p class="muted-note">${esc(t)}</p><p style="text-align:center;margin-top:1.5rem"><a class="btn btn-ghost" href="index.html#biblioteca">Voltar à biblioteca</a></p></section>`; };

if (!/^[a-z0-9-]{1,40}$/.test(autor) || !/^[a-z0-9-]{1,60}$/.test(obra)) msg('Obra não informada.');
else if (cap) capitulo(); else sumario();

async function sumario() {
  let o;
  try { o = await api(`/api/leitura/${autor}/${obra}`); } catch (e) { return msg(e.status === 404 ? 'Esta obra não está disponível.' : 'Não foi possível carregar a obra.'); }
  document.title = `${o.titulo} | Entrelinhas`;
  const autorLink = `<a href="autor.html?a=${encodeURIComponent(o.autor.slug)}">${esc(o.autor.nome)}</a>`;
  root.innerHTML = `
  <section class="page active ler">
    <div class="ler-obra">
      ${o.capa ? `<img class="ler-capa" src="${esc(imgUrl(o.capa))}" alt="Capa de ${esc(o.titulo)}">` : ''}
      <div>
        <span class="eyebrow">${esc(o.genero || 'Obra publicada')}</span>
        <h2>${esc(o.titulo)} ${EL.faixa(o.faixa)}</h2>
        <p class="ler-autor">por ${autorLink}</p>
        ${o.sinopse ? `<p class="ler-sinopse">${esc(o.sinopse)}</p>` : ''}
        <p class="ler-meta">${o.capitulos.length} capítulo${o.capitulos.length === 1 ? '' : 's'} · ${milhar(o.palavras)} palavras${o.publicado_em ? ` · no Entrelinhas desde ${new Date(o.publicado_em * 1000).toLocaleDateString('pt-BR')}` : ''}</p>
        ${EL.FAIXAS.find((x) => x[0] === o.faixa) ? `<p class="ler-meta">${esc(EL.FAIXAS.find((x) => x[0] === o.faixa)[1])}</p>` : ''}
        <p class="livro-acoes">${o.capitulos.length ? `<a class="btn btn-primary" href="${base}&c=${o.capitulos[0].n}">Começar a ler</a>` : ''}<a class="btn btn-ghost" href="obra.html?a=${encodeURIComponent(autor)}&o=${esc(o.id)}">Página do livro</a></p>
        <p><a class="livro-denunciar" href="obra.html?a=${encodeURIComponent(autor)}&o=${esc(o.id)}#denunciar">Denunciar este livro</a></p>
        ${o.creditos ? `<p class="ler-creditos">${esc(o.creditos)}</p>` : ''}
      </div>
    </div>
    <div class="section-head"><div><span class="eyebrow">Sumário</span><h2>Capítulos</h2></div><div class="line"></div></div>
    <ol class="ler-sumario">${o.capitulos.map((c) => `<li><a href="${base}&c=${c.n}"><span>${esc(c.titulo)}</span><small>${milhar(c.palavras)} palavras</small></a></li>`).join('')}</ol>
    <div class="section-head"><div><span class="eyebrow">Leitores</span><h2>Avaliações</h2></div><div class="line"></div></div>
    <div class="ler-reviews rev-box"></div>
  </section>`;
  EL.reviews.mount(root.querySelector('.ler-reviews'), { autor, obra: o.id });
}

async function capitulo() {
  let c;
  try { c = await api(`/api/leitura/${autor}/${obra}/${cap}`); } catch (e) { return msg(e.status === 404 ? 'Capítulo não encontrado.' : 'Não foi possível carregar o capítulo.'); }
  document.title = `${c.titulo} · ${c.obra.titulo} | Entrelinhas`;
  const nav = () => `<nav class="ler-nav">
      ${c.anterior ? `<a class="btn btn-ghost" href="${base}&c=${c.anterior}">&larr; Anterior</a>` : '<span></span>'}
      <a class="btn btn-ghost" href="${base}">Sumário</a>
      ${c.proximo ? `<a class="btn btn-primary" href="${base}&c=${c.proximo}">Próximo &rarr;</a>` : '<span></span>'}
    </nav>`;
  root.innerHTML = `
  <section class="page active ler">
    <p class="ler-trilha"><a href="${base}">${esc(c.obra.titulo)}</a> · <a href="autor.html?a=${encodeURIComponent(c.obra.autor.slug)}">${esc(c.obra.autor.nome)}</a> · capítulo ${c.n} de ${c.total}</p>
    <article class="ler-texto"><h2>${esc(c.titulo)}</h2></article>
    ${nav()}
    <section class="ler-comentarios" hidden>
      <div class="section-head"><div><span class="eyebrow">Leitores</span><h2>Comentários</h2></div><div class="line"></div></div>
      <p class="hint">Os comentários usam o Disqus, um serviço de fora do Entrelinhas: ele só carrega se você pedir, e pode exibir anúncios e usar cookies próprios.</p>
      <button type="button" class="btn btn-ghost" id="ver-comentarios">Ver comentários</button>
      <div id="disqus_thread"></div>
    </section>
  </section>`;
  root.querySelector('.ler-texto').append(renderizar(c.corpo));
  // "continuar lendo" na pagina do livro: guarda o ultimo capitulo aberto neste aparelho
  try { localStorage.setItem('el:lendo:' + c.conversa.split('-')[0], String(c.n)); } catch { /* armazenamento bloqueado */ }
  window.scrollTo(0, 0);
  comentarios(c);
}

// Disqus: so aparece com o shortname configurado (wrangler.jsonc: DISQUS_SHORTNAME) e so carrega no clique.
async function comentarios(c) {
  let cfg = null;
  try { cfg = await api('/api/config'); } catch { return; }
  if (!cfg || !cfg.disqus) return;
  const box = root.querySelector('.ler-comentarios');
  box.hidden = false;
  box.querySelector('#ver-comentarios').addEventListener('click', (e) => {
    e.target.remove();
    const pagina = `${location.origin}/ler.html?a=${encodeURIComponent(autor)}&o=${encodeURIComponent(obra)}&c=${c.n}`;
    window.disqus_config = function () {
      this.page.url = pagina;
      this.page.identifier = c.conversa;
      this.page.title = `${c.titulo} · ${c.obra.titulo}`;
      this.language = 'pt_BR';
    };
    const s = document.createElement('script');
    s.src = `https://${cfg.disqus}.disqus.com/embed.js`;
    s.setAttribute('data-timestamp', String(Date.now()));
    s.async = true;
    document.body.append(s);
  }, { once: true });
}
</script>
</body>
</html>
