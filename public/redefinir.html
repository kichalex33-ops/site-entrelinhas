<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova senha | Entrelinhas</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="extra.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <a class="brand-mark" href="index.html" aria-label="Entrelinhas, página inicial"><img src="/marca/raposa.png" alt="" width="56" height="56"></a>
    <h1><a href="index.html" style="color:inherit;text-decoration:none">ENTRE<b>LINHAS</b></a></h1>
    <p class="tagline">Coletivo de Escritores Independentes</p>
  </div>
  <nav class="tabs">
    <a class="tab" href="index.html#home">Início</a>
    <a class="tab" href="index.html#biblioteca">Biblioteca</a>
    <a class="tab" href="index.html#lancamentos">Lançamentos</a>
    <a class="tab" href="index.html#projetos">Projetos</a>
    <a class="tab" href="index.html#servicos">Serviços</a>
    <a class="tab" href="autores.html">Autores</a>
  </nav>
</header>

<main>
  <section class="page active">
    <div class="hero" style="padding-bottom:.5rem">
      <span class="eyebrow">Conta</span>
      <h2>Criar <em>nova senha</em></h2>
      <p>Escolha uma senha nova para entrar no Entrelinhas.</p>
    </div>
    <div class="auth-box">
      <form id="f">
        <label class="fld"><span>Nova senha (mínimo 10 caracteres)</span><input name="nova" type="password" required minlength="10" maxlength="200" autocomplete="new-password"></label>
        <label class="fld"><span>Repita a nova senha</span><input name="conf" type="password" required minlength="10" maxlength="200" autocomplete="new-password"></label>
        <button class="btn btn-primary" type="submit">Salvar nova senha</button>
        <div id="msg"></div>
      </form>
      <p class="hint" style="margin-top:1rem"><a href="recuperar.html">Pedir outro link</a> · <a href="conta.html">Voltar para o login</a></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="f-links">
    <a href="#" class="to-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Voltar ao topo &#8593;</a>
  </div>
  <div class="f-brand">ENTRE<b>LINHAS</b></div>
  <p>© 2026 Coletivo Entrelinhas</p>
</footer>

<script src="common.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const f = document.getElementById('f'), msg = document.getElementById('msg');
const note = (t, ok) => { msg.innerHTML = `<p class="note ${ok ? 'ok' : 'err'}" role="status">${EL.esc(t)}</p>`; };
// tira o token da barra de endereco (nao fica no historico nem em capturas de tela)
if (token) history.replaceState(null, '', location.pathname);
if (!/^[a-f0-9]{64}$/.test(token)) { note('Este link está incompleto. Peça um novo.'); f.querySelector('button').disabled = true; }
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (f.nova.value !== f.conf.value) return note('As duas senhas não são iguais.');
  const b = f.querySelector('button'); b.disabled = true;
  try {
    await EL.api('/api/redefinir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, nova: f.nova.value }) });
    note('Senha trocada. Levando você para o login...', true);
    setTimeout(() => { location.href = 'conta.html'; }, 1500);
  } catch (err) { note(err.message); b.disabled = false; }
});
</script>
</body>
</html>
