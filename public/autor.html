<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autor | Entrelinhas</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<script src="tema.js"></script>
<script src="menu.js" defer></script>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="extra.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <a class="brand-mark" href="index.html" aria-label="Entrelinhas, página inicial"><img src="/marca/raposa.png" alt="" width="56" height="56"></a>
    <h1><a href="index.html" style="color:inherit;text-decoration:none">ENTRE<b>LINHAS</b></a></h1>
    <p class="tagline">Coletivo de Escritores Independentes</p>
  </div>
  <nav class="tabs">
    <a class="tab" href="index.html#home">Início</a>
    <a class="tab" href="index.html#biblioteca">Biblioteca</a>
    <a class="tab" href="index.html#lancamentos">Lançamentos</a>
    <a class="tab" href="index.html#projetos">Projetos</a>
    <a class="tab" href="index.html#servicos">Serviços</a>
    <a class="tab active" href="autores.html">Autores</a>
    <a class="tab" href="leitores.html">Leitores</a>
  </nav>
</header>

<main id="root"><section class="page active"><p class="muted-note">Carregando...</p></section></main>

<footer class="site-footer">
  <div class="f-links">
    <a href="#" class="to-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Voltar ao topo &#8593;</a>
    <a href="conta.html">Minha conta</a>
  </div>
  <div class="f-brand">ENTRE<b>LINHAS</b></div>
  <nav class="f-legal" aria-label="Institucional"><a href="sobre.html">Sobre</a><a href="termos.html">Termos de Uso</a><a href="privacidade.html">Privacidade</a><a href="diretrizes.html">Diretrizes</a><a href="mailto:contato@entrelinhasbr.com.br">Contato</a><a href="feedback.html" class="f-feedback">Feedback do beta</a></nav>
  <p>© 2026 Coletivo Entrelinhas</p>
</footer>

<script src="common.js"></script>
<script src="reviews.js"></script>
<script>
(async function(){
  const { esc, imgUrl, paras, linkAttrs, theme, initial, api } = EL;
  const root = document.getElementById('root');
  const slug = new URLSearchParams(location.search).get('a') || '';
  const msg = (t) => { root.innerHTML = `<section class="page active"><p class="muted-note">${esc(t)}</p><p style="text-align:center;margin-top:1.5rem"><a class="btn btn-ghost" href="autores.html">Ver todos os autores</a></p></section>`; };
  if (!/^[a-z0-9-]{1,40}$/.test(slug)) return msg('Autor não informado.');

  let p;
  try { p = await api('/api/profile/' + slug); } catch (e) { return msg(e.status === 404 ? 'Perfil não encontrado.' : 'Não foi possível carregar o perfil.'); }
  const d = p.data;
  document.title = d.nome + ' | Entrelinhas';

  // obras do Estudio: publicado_em = entrada no site (timestamp); livros divulgados: publicado_em = lancamento ("AAAA" ou "AAAA-MM") e no_site_em
  const dia = (t) => new Date(t * 1000).toLocaleDateString('pt-BR');
  const datas = (o) => (typeof o.publicado_em === 'number'
    ? [`No Entrelinhas desde ${dia(o.publicado_em)}`]
    : [EL.mesAno(o.publicado_em) && `Lançado em ${EL.mesAno(o.publicado_em)}`, o.no_site_em && `No site desde ${dia(o.no_site_em)}`]).filter(Boolean).map(esc).join(' · ');
  const obra = (o) => `
    <article class="work">
      ${((c) => o.id ? `<a class="work-capa" href="obra.html?a=${encodeURIComponent(slug)}&o=${esc(o.id)}">${c}</a>` : c)(o.capa ? `<img src="${esc(imgUrl(o.capa))}" alt="Capa de ${esc(o.titulo)}" loading="lazy">` : `<div class="typo">${initial(o.titulo)}</div>`)}
      <span class="status${o.status === 'Publicado' ? ' on' : ''}">${esc(o.status)}</span>
      <h3>${o.id ? `<a class="work-link" href="obra.html?a=${encodeURIComponent(slug)}&o=${esc(o.id)}">${esc(o.titulo)}</a>` : esc(o.titulo)} ${EL.faixa(o.faixa)}</h3>
      ${o.genero ? `<p class="by">${esc(o.genero)}</p>` : ''}
      ${datas(o) ? `<p class="by datas">${datas(o)}</p>` : ''}
      ${o.sinopse ? `<p>${esc(o.sinopse)}</p>` : ''}
      <p class="rev-line">${o.reviews && o.reviews.total ? `<span class="stars">${'★'.repeat(Math.round(o.reviews.media))}${'☆'.repeat(5 - Math.round(o.reviews.media))}</span> ${o.reviews.media.toFixed(1)} · ${o.reviews.total} avaliaç${o.reviews.total === 1 ? 'ão' : 'ões'}` : 'Sem avaliações ainda'}</p>
      ${o.url ? `<div class="buy"><a class="btn btn-primary" href="${esc(o.url)}">Ler no Entrelinhas · ${o.capitulos} cap.</a></div>` : ''}
      ${o.link || (o.lojas || []).length ? `<div class="buy">${o.link ? `<a class="btn btn-ghost" href="${esc(o.link)}"${linkAttrs(o.link)}>${/amazon.|uiclap/i.test(o.link) ? 'Comprar' : 'Conhecer'}</a>` : ''}${(o.lojas || []).map(l => `<a class="btn btn-ghost" href="${esc(l.url)}"${linkAttrs(l.url)}>${esc(l.rotulo)}</a>`).join('')}</div>` : ''}
      ${isOwner && o.url ? `<p class="owner-edit"><a class="btn btn-ghost" href="estudio.html#/obra/${esc(o.id)}">Editar no Estúdio</a></p>` : ''}
      ${isOwner && o.id && !o.url ? `<p class="owner-edit"><a class="btn btn-ghost" href="conta.html#obra-${esc(o.id)}">Editar este livro, sinopse e links de venda</a></p>` : ''}
      ${o.id ? `<p class="owner-edit"><a class="btn btn-ghost" href="obra.html?a=${encodeURIComponent(slug)}&o=${esc(o.id)}">Página do livro</a></p>` : ''}
      ${o.id ? `<button type="button" class="btn btn-ghost rev-toggle" data-obra="${esc(o.id)}">Ver e escrever avaliações</button><div class="rev-box" hidden></div>` : ''}
    </article>`;

  // botao do chat: so aparece no perfil de moderador, para quem esta logado como moderador
  let me = null;
  try { me = await api('/api/me'); } catch (e) {}
  const viewerMod = !!(p.mod && me && me.mod);
  // dono do perfil: ve os atalhos de edicao (a edicao em si acontece em conta.html)
  const isOwner = !!(me && me.role === 'autor' && me.slug === slug);
  // obras publicadas pelo Estudio vem primeiro (leitura no proprio site), depois os livros do perfil
  const obras = [...(p.publicadas || []).map((o) => ({ ...o, status: 'Publicado' })), ...d.obras];

  // nota media de todos os livros do autor (soma ponderada pelas avaliacoes de cada livro)
  const notaGeral = obras.reduce((g, o) => (o.reviews && o.reviews.total ? { total: g.total + o.reviews.total, soma: g.soma + o.reviews.media * o.reviews.total } : g), { total: 0, soma: 0 });
  notaGeral.media = notaGeral.total ? notaGeral.soma / notaGeral.total : 0;

  root.innerHTML = `
  <section class="page active" id="perfil">
    <div class="profile">
      <div class="profile-photo${p.mod ? ' is-mod' : ''}">${d.retrato ? `<img src="${esc(imgUrl(d.retrato))}" alt="Foto de ${esc(d.nome)}">` : `<div class="typo" style="aspect-ratio:3/4">${initial(d.nome)}</div>`}${p.mod ? '<span class="mod-seal">&#9733; Moderador e Idealizador do projeto</span>' : ''}</div>
      <div class="profile-text">
        ${isOwner ? '<div class="owner-bar"><a class="btn btn-primary" href="conta.html">Editar perfil e bio</a><a class="btn btn-ghost" href="conta.html#nova-obra">Adicionar livro</a><a class="btn btn-ghost" href="estudio.html">Estúdio de escrita</a></div>' : ''}
        <span class="eyebrow">Perfil do autor${d.local ? ' · ' + esc(d.local) : ''}</span>
        <h2>${esc(d.nome)}</h2>
        <div class="autor-destaque">
          ${isOwner ? '' : '<button type="button" class="btn btn-primary" id="seguirBtn" hidden>+ Seguir</button>'}
          <span id="seguidores" class="autor-num"></span>
          ${notaGeral.total ? `<a class="autor-num autor-nota" href="#obras" title="Média das avaliações de todos os livros"><span class="stars" aria-hidden="true">${'★'.repeat(Math.round(notaGeral.media))}${'☆'.repeat(5 - Math.round(notaGeral.media))}</span> <b>${notaGeral.media.toFixed(1).replace('.', ',')}</b> · ${notaGeral.total} ${notaGeral.total === 1 ? 'avaliação' : 'avaliações'}</a>` : '<span class="autor-num hint">Sem avaliações ainda</span>'}
        </div>
        ${d.frase ? `<p class="lead">${esc(d.frase)}</p>` : ''}
        ${paras(d.bio)}
        ${d.citacao ? `<p class="quote-line">${esc(d.citacao)}</p>` : ''}
        ${p.badges.length ? `<div class="badges">${p.badges.map(b => `<span class="badge-pill">${esc(b)}</span>`).join('')}</div>` : ''}
        ${d.links.length ? `<p class="links">${d.links.map((l, i) => `<a class="btn ${i ? 'btn-ghost' : 'btn-primary'}" href="${esc(l.url)}"${linkAttrs(l.url)}>${esc(l.rotulo)}</a>`).join('')}</p>` : ''}
        ${viewerMod ? '<p class="links"><a class="btn btn-primary mod-chat-btn" href="chat.html">&#9733; Entrar no chat da moderação</a><a class="btn btn-ghost" href="https://mail.proton.me/" target="_blank" rel="noopener noreferrer">Abrir a caixa de e-mails</a></p>' : ''}
      </div>
    </div>
    ${obras.length || isOwner ? `<div class="section-head" id="obras"><div><span class="eyebrow">Obras</span><h2>Livros e projetos</h2></div><div class="line"></div></div>${obras.length ? `<div class="works">${obras.map(obra).join('')}</div>` : '<p class="muted-note">Você ainda não cadastrou nenhum livro. <a href="conta.html#nova-obra">Adicionar o primeiro livro</a>.</p>'}` : ''}
    ${d.secoes.map(s => `${s.titulo ? `<div class="section-head"><div><h2>${esc(s.titulo)}</h2></div><div class="line"></div></div>` : ''}<div class="prose">${paras(s.texto)}</div>`).join('')}
    <p style="text-align:center;margin:3rem 0 0"><a class="btn btn-ghost" href="autores.html">Ver todos os autores</a></p>
  </section>`;
  theme(root, d);

  // seguir o autor (leitores e outros autores); quem nao entrou e levado ao login
  const segBtn = document.getElementById('seguirBtn'), segN = document.getElementById('seguidores');
  const mostrarSeg = (r) => {
    segN.innerHTML = `<b>${r.seguidores}</b> ${r.seguidores === 1 ? 'seguidor' : 'seguidores'}`;
    if (segBtn) { segBtn.hidden = false; segBtn.textContent = r.seguindo ? 'Seguindo' : '+ Seguir'; segBtn.className = 'btn ' + (r.seguindo ? 'btn-ghost' : 'btn-primary'); }
  };
  try { mostrarSeg(await api(`/api/seguir/${encodeURIComponent(slug)}`)); } catch (e) { /* contagem nao e essencial */ }
  if (segBtn) segBtn.addEventListener('click', async () => {
    if (!me) { location.href = 'conta.html'; return; }
    segBtn.disabled = true;
    try { mostrarSeg(await api(`/api/seguir/${encodeURIComponent(slug)}`, { method: 'POST' })); } catch (e) { /* mantem */ }
    segBtn.disabled = false;
  });

  root.querySelectorAll('.rev-toggle').forEach((b) => b.addEventListener('click', () => {
    const box = b.parentElement.querySelector('.rev-box');
    box.hidden = !box.hidden;
    b.textContent = box.hidden ? 'Ver e escrever avaliações' : 'Fechar avaliações';
    if (!box.hidden) EL.reviews.mount(box, { autor: slug, obra: b.dataset.obra });
  }));
})();
</script>
</body>
</html>
