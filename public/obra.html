<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livro | Entrelinhas</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<script src="tema.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="extra.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <a class="brand-mark" href="index.html" aria-label="Entrelinhas, página inicial"><img src="/marca/raposa.png" alt="" width="56" height="56"></a>
    <h1><a href="index.html" style="color:inherit;text-decoration:none">ENTRE<b>LINHAS</b></a></h1>
    <p class="tagline">Coletivo de Escritores Independentes</p>
  </div>
  <nav class="tabs">
    <a class="tab" href="index.html#home">Início</a>
    <a class="tab active" href="index.html#biblioteca">Biblioteca</a>
    <a class="tab" href="index.html#lancamentos">Lançamentos</a>
    <a class="tab" href="index.html#projetos">Projetos</a>
    <a class="tab" href="index.html#servicos">Serviços</a>
    <a class="tab" href="autores.html">Autores</a>
  </nav>
</header>

<main id="root"><section class="page active"><p class="muted-note">Carregando...</p></section></main>

<footer class="site-footer">
  <div class="f-links">
    <a href="#" class="to-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Voltar ao topo &#8593;</a>
    <a href="conta.html">Área do autor</a>
  </div>
  <div class="f-brand">ENTRE<b>LINHAS</b></div>
  <p>© 2026 Coletivo Entrelinhas</p>
</footer>

<script src="common.js"></script>
<script src="reviews.js"></script>
<script>
// Pagina do livro: obra.html?a=autor&o=id-da-obra[#aba]
// Dados basicos vem do perfil (livro divulgado) ou da publicacao do Estudio; o resto o autor preenche aqui mesmo.
(function () {
  'use strict';
  const { esc, imgUrl, api, faixa, mesAno, FAIXAS, initial } = window.EL;
  const root = document.getElementById('root');
  const q = new URLSearchParams(location.search);
  const autor = q.get('a') || '', obraId = q.get('o') || '';
  const ABAS = [['detalhes', 'Sinopse'], ['capitulos', 'Capítulos'], ['personagens', 'Personagens'], ['galeria', 'Galeria'], ['materiais', 'Materiais'], ['avaliacoes', 'Avaliações'], ['extras', 'Extras e Notas']];
  const milhar = (n) => Number(n || 0).toLocaleString('pt-BR');
  const dia = (t) => new Date(t * 1000).toLocaleDateString('pt-BR');
  const paras = (t) => String(t || '').split(/\n{2,}/).map((s) => s.trim()).filter(Boolean).map((p) => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
  const msg = (t) => { root.innerHTML = `<section class="page active"><p class="muted-note">${esc(t)}</p><p style="text-align:center;margin-top:1.5rem"><a class="btn btn-ghost" href="index.html#biblioteca">Voltar à biblioteca</a></p></section>`; };
  let D = null;

  if (!/^[a-z0-9-]{1,40}$/.test(autor) || !/^[a-f0-9]{12}$/.test(obraId)) return msg('Livro não informado.');
  carregar();

  async function carregar() {
    try { D = await api(`/api/livro/${autor}/${obraId}`); } catch (e) { return msg(e.status === 404 ? 'Este livro não está disponível.' : 'Não foi possível carregar o livro.'); }
    desenhar();
    // visualizacao: o servidor conta uma por visitante por dia (e ignora o dono)
    if (D.dono) return;
    try {
      const n = (await api(`/api/livro/${autor}/${obraId}/visita`, { method: 'POST' })).visualizacoes;
      D.numeros.visualizacoes = n;
      const box = root.querySelector('[data-num=visualizacoes]');
      if (box) box.innerHTML = `<b>${milhar(n)}</b><span>${n === 1 ? 'visualização' : 'visualizações'}</span>`;
    } catch { /* contagem nao e essencial */ }
  }

  function painel(aba) {
    const p = D.pagina, o = D.obra;
    if (aba === 'detalhes') return `
      <div class="livro-sinopse">${paras(o.sinopse) || '<p class="hint">O autor ainda não escreveu a sinopse.</p>'}</div>
      ${p.contexto ? `<h3>Bastidores</h3>${paras(p.contexto)}` : ''}
      ${p.estilo ? `<h3>Estilo e tom</h3>${paras(p.estilo)}` : ''}
      ${o.creditos ? `<p class="hint livro-creditos">Créditos: ${esc(o.creditos)}</p>` : ''}`;
    if (aba === 'extras') return extras();
    if (aba === 'capitulos') return `<ol class="ler-sumario">${(D.capitulos || []).map((c) => `<li><a href="${esc(o.url)}&c=${c.n}"><span>${esc(c.titulo)}</span><small>${milhar(c.palavras)} palavras</small></a></li>`).join('')}</ol>`;
    if (aba === 'personagens') return `<div class="livro-pers">${p.personagens.map((c) => `<article class="pers">
        <div class="pers-foto">${c.imagem ? `<img src="${esc(imgUrl(c.imagem))}" alt="${esc(c.nome)}" loading="lazy">` : `<span>${initial(c.nome)}</span>`}</div>
        <div><h4>${esc(c.nome)}</h4>${c.papel ? `<p class="by">${esc(c.papel)}</p>` : ''}${c.descricao ? paras(c.descricao) : ''}</div></article>`).join('')}</div>`;
    if (aba === 'galeria') return `<div class="livro-galeria">${p.imagens.map((i, n) => `<figure><button type="button" data-foto="${n}" aria-label="Ampliar ${esc(i.legenda || 'imagem')}"><img src="${esc(imgUrl(i.id))}" alt="${esc(i.legenda)}" loading="lazy"></button>${i.legenda ? `<figcaption>${esc(i.legenda)}</figcaption>` : ''}</figure>`).join('')}</div>`;
    if (aba === 'materiais') return `<ul class="livro-mat">${p.materiais.map((m) => `<li><a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer nofollow">${esc(m.rotulo)} &#8599;</a>${m.descricao ? `<span class="hint">${esc(m.descricao)}</span>` : ''}</li>`).join('')}</ul>`;
    if (aba === 'avaliacoes') return '<div class="rev-box livro-rev"></div>';
    return '';
  }

  function abasVisiveis() {
    const p = D.pagina;
    const tem = { detalhes: true, capitulos: !!(D.capitulos && D.capitulos.length), personagens: p.personagens.length, galeria: p.imagens.length, materiais: p.materiais.length, avaliacoes: true, extras: D.posts.length || D.dono };
    const n = { capitulos: D.capitulos && D.capitulos.length, personagens: p.personagens.length, galeria: p.imagens.length, materiais: p.materiais.length, avaliacoes: D.avaliacoes.total, extras: D.posts.length };
    return ABAS.filter(([k]) => tem[k]).map(([k, r]) => [k, n[k] ? `${r} (${n[k]})` : r]);
  }

  // lancamento: livro divulgado = mes/ano informado pelo autor; obra do Estudio = dia em que foi publicada no site
  const lancamento = () => mesAno(D.obra.publicado_em) || (D.tipo === 'estudio' && D.obra.no_site_em ? dia(D.obra.no_site_em) : '');

  function numeros() {
    const av = D.avaliacoes, caps = D.capitulos || [], nu = D.numeros, um = (n, s, p) => (n === 1 ? s : p);
    const itens = [
      [milhar(nu.visualizacoes), um(nu.visualizacoes, 'visualização', 'visualizações'), 'visualizacoes'],
      [milhar(nu.favoritos), um(nu.favoritos, 'favorito', 'favoritos'), 'favoritos'],
      [av.total ? `${av.media.toFixed(1).replace('.', ',')} ★` : '—', av.total ? `${av.total} avaliaç${av.total === 1 ? 'ão' : 'ões'}` : 'sem avaliações'],
      caps.length && [milhar(caps.length), um(caps.length, 'capítulo', 'capítulos')],
      caps.length && [milhar(caps.reduce((s, c) => s + c.palavras, 0)), 'palavras'],
      lancamento() && [lancamento(), 'lançado em'],
      [milhar(nu.denuncias), um(nu.denuncias, 'denúncia', 'denúncias')],
    ].filter(Boolean);
    return `<div class="livro-numeros">${itens.map(([v, r, k]) => `<div${k ? ` data-num="${k}"` : ''}><b>${esc(v)}</b><span>${esc(r)}</span></div>`).join('')}</div>`;
  }

  // ---------- Extras e Notas: novidades, imagens e spoilers do autor; comentarios pelo Disqus ----------
  function extras() {
    const a = D.autor;
    const avatar = a.retrato ? `<img class="extra-avatar" src="${esc(imgUrl(a.retrato))}" alt="">` : `<span class="extra-avatar">${initial(a.nome)}</span>`;
    const novo = D.dono ? `<form class="el-form extra-novo">
        <label class="fld"><span>Novo extra</span><textarea name="texto" rows="3" maxlength="3000" placeholder="Novidades do livro, curiosidades, arte promocional, spoilers..."></textarea></label>
        <div class="extra-novo-img" hidden></div>
        <div class="extra-novo-acoes">
          <label class="btn btn-ghost ed-up">Imagem<input type="file" accept="image/jpeg,image/png,image/webp" data-upextra hidden></label>
          <label class="extra-spoiler-op"><input type="checkbox" name="spoiler"> Contém spoiler</label>
          <button type="button" class="btn btn-primary" data-publicar>Publicar</button>
        </div>
        <div class="el-estado" role="status"></div></form>` : '';
    const post = (x) => `<article class="extra" id="extra-${x.id}">
        <header class="extra-cab">${avatar}<div><b>${esc(a.nome)}</b><span class="hint">${dia(x.created_at)}</span></div>${x.spoiler ? '<span class="extra-tag-spoiler">Spoiler</span>' : ''}</header>
        <div class="extra-corpo${x.spoiler ? ' spoiler' : ''}">
          ${x.spoiler ? '<button type="button" class="extra-revelar" data-revelar>Contém spoiler. Clique para revelar</button>' : ''}
          ${paras(x.texto)}${x.imagem ? `<img class="extra-img" src="${esc(imgUrl(x.imagem))}" alt="" loading="lazy">` : ''}
        </div>
        <footer class="extra-rodape">
          <button type="button" class="extra-bt" data-curtir="${x.id}" aria-pressed="${x.curti}">${x.curti ? '&#10084;&#65039;' : '&#129293;'} <span>${x.curtidas}</span></button>
          <button type="button" class="extra-bt" data-comentar="${x.id}">&#128172; Comentários</button>
          ${D.dono ? `<button type="button" class="rm" data-apagar="${x.id}">Apagar</button>` : ''}
        </footer>
        <div class="extra-comentarios" hidden></div>
      </article>`;
    return `${novo}<div class="extras">${D.posts.map(post).join('') || '<p class="hint">Nenhum extra publicado ainda. Use o campo acima para contar novidades, mostrar artes ou soltar spoilers (marcados, eles ficam escondidos até o leitor clicar).</p>'}</div>`;
  }

  // Disqus: um so quadro na pagina; abre no extra escolhido (DISQUS.reset troca a conversa)
  let disqusNome;
  async function comentar(id, box) {
    if (disqusNome === undefined) { try { disqusNome = (await api('/api/config')).disqus || null; } catch { disqusNome = null; } }
    document.querySelectorAll('.extra-comentarios').forEach((b) => { if (b !== box) { b.hidden = true; b.replaceChildren(); } });
    box.hidden = false;
    if (!disqusNome) { box.innerHTML = '<p class="hint">Os comentários ainda não estão ativados no site.</p>'; return; }
    box.innerHTML = '<p class="hint">Os comentários usam o Disqus, um serviço de fora do Entrelinhas, que pode exibir anúncios e usar cookies próprios.</p><div id="disqus_thread"></div>';
    const config = function () {
      this.page.url = `${location.origin}/obra.html?a=${encodeURIComponent(autor)}&o=${obraId}#extra-${id}`;
      this.page.identifier = `livro-post-${id}`;
      this.page.title = `Extra de ${D.obra.titulo}`;
      this.language = 'pt_BR';
    };
    if (window.DISQUS) return window.DISQUS.reset({ reload: true, config });
    window.disqus_config = config;
    const s = document.createElement('script');
    s.src = `https://${disqusNome}.disqus.com/embed.js`;
    s.setAttribute('data-timestamp', String(Date.now()));
    s.async = true;
    document.body.append(s);
  }

  let novaImagem = '';
  async function publicarExtra(f) {
    const estado = f.querySelector('.el-estado'), bt = f.querySelector('[data-publicar]');
    bt.disabled = true;
    try {
      const r = await api(`/api/livro/${obraId}/posts`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texto: f.texto.value, imagem: novaImagem, spoiler: f.spoiler.checked }) });
      D.posts = r.posts; novaImagem = ''; desenhar();
    } catch (err) { estado.innerHTML = `<p class="note err">${esc(err.message)}</p>`; bt.disabled = false; }
  }

  const pedirLogin = (titulo, texto) => {
    const d = janela(titulo, el(`<p>${esc(texto)} Leitores podem criar uma conta grátis.</p>`), [botao('Fechar', 'btn-ghost', () => d.close()), el('<a class="btn btn-primary" href="conta.html">Entrar</a>')]);
  };

  function desenhar() {
    const o = D.obra, p = D.pagina;
    document.title = `${o.titulo} | Entrelinhas`;
    const abas = abasVisiveis();
    const pedida = location.hash.slice(1);
    if (pedida === 'denunciar') { history.replaceState(null, '', location.pathname + location.search); setTimeout(denunciar, 0); }
    const extraPedido = /^extra-\d+$/.test(pedida) && D.posts.some((x) => 'extra-' + x.id === pedida);
    const ativa = extraPedido ? 'extras' : abas.some(([k]) => k === pedida) ? pedida : 'detalhes';
    const lojas = [o.link && { rotulo: /amazon\./i.test(o.link) ? 'Amazon' : /uiclap/i.test(o.link) ? 'Uiclap' : 'Comprar', url: o.link }, ...(o.lojas || []), ...p.lojas]
      .filter((l, i, t) => l && t.findIndex((x) => x && x.url === l.url) === i);
    const caps = D.capitulos || [];
    // "continuar lendo": ultimo capitulo aberto neste aparelho (gravado pelo ler.html)
    let lendo = 0;
    try { lendo = Number(localStorage.getItem('el:lendo:' + obraId)) || 0; } catch { /* sem armazenamento */ }
    const continuar = o.url && lendo && caps.some((c) => c.n === lendo);
    const generos = String(o.genero || '').split(/\s*[·,/]\s*/).filter(Boolean);
    const fx = FAIXAS.find((x) => x[0] === o.faixa);
    root.innerHTML = `
    <section class="page active livro">
      <div class="livro-hero">
        <div class="livro-capa">${o.capa ? `<img class="ler-capa" src="${esc(imgUrl(o.capa))}" alt="Capa de ${esc(o.titulo)}">` : `<div class="typo">${initial(o.titulo)}</div>`}</div>
        <div class="livro-cab">
          <h2 class="livro-titulo">${esc(o.titulo)}</h2>
          ${p.alt_titulos ? `<p class="livro-alt">${esc(p.alt_titulos)}</p>` : ''}
          <p class="livro-por">por <a href="autor.html?a=${encodeURIComponent(D.autor.slug)}">${esc(D.autor.nome)}</a></p>
          <div class="livro-chips">${o.status ? `<span class="chip-st">${esc(o.status)}</span>` : ''}${generos.map((g) => `<span>${esc(g)}</span>`).join('')}</div>
          ${fx || p.aviso ? `<div class="livro-cw">${faixa(o.faixa)}<p>${p.aviso ? `<b>Aviso de conteúdo:</b> ${esc(p.aviso)} ` : ''}${fx ? esc(fx[1]) + '.' : ''}</p></div>` : ''}
          ${p.tags.length ? `<p class="livro-tags">${p.tags.map((t) => `<span>#${esc(t)}</span>`).join('')}</p>` : ''}
          <div class="livro-acoes">
            ${continuar ? `<a class="btn btn-primary" href="${esc(o.url)}&c=${lendo}">&#9654; Continuar lendo (cap. ${lendo})</a>` : ''}
            ${o.url && caps.length ? `<a class="btn ${continuar ? 'btn-ghost' : 'btn-primary'}" href="${esc(o.url)}&c=${caps[0].n}">${continuar ? 'Ler do início' : '&#9654; Iniciar leitura'}</a>` : ''}
            <button type="button" class="livro-ico livro-fav" data-favoritar aria-pressed="${D.favorito}" title="${D.favorito ? 'Tirar dos favoritos' : 'Adicionar aos favoritos'}" aria-label="${D.favorito ? 'Tirar dos favoritos' : 'Adicionar aos favoritos'}">${D.favorito ? '&#10084;&#65039;' : '&#129293;'}</button>
            <button type="button" class="livro-ico" data-estante title="Pôr na estante" aria-label="Pôr na estante">&#128218;</button>
            <button type="button" class="livro-ico" data-copiar title="Copiar link" aria-label="Copiar link">&#128279;</button>
            <button type="button" class="livro-ico livro-flag" data-denunciar ${D.dono ? 'disabled title="Você não pode denunciar o próprio livro"' : 'title="Denunciar este livro"'} aria-label="Denunciar este livro">&#128681;</button>
          </div>
          ${lojas.length ? `<p class="livro-lojas"><span>Disponível em:</span>${lojas.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.rotulo)}</a>`).join('')}</p>` : ''}
          ${D.dono ? '<p><button type="button" class="btn btn-ghost" data-editar>Editar página do livro</button></p>' : ''}
        </div>
      </div>
      ${numeros()}
      ${D.dono && D.denuncias && D.denuncias.length ? `<div class="livro-aviso" role="status"><b>Este livro tem denúncias em análise pela moderação:</b> ${D.denuncias.map((x) => `${esc(x.rotulo)} (${x.n})`).join(' · ')}. Se tiver algo a esclarecer, fale com um moderador do coletivo.</div>` : ''}
      <nav class="livro-abas" role="tablist">${abas.map(([k, r]) => `<button type="button" role="tab" data-aba="${k}" aria-selected="${k === ativa}">${esc(r)}</button>`).join('')}</nav>
      <div class="livro-painel" role="tabpanel">${painel(ativa)}</div>
      ${D.dono && !p.personagens.length && !p.imagens.length && !p.materiais.length && !p.contexto ? '<p class="hint livro-dica">Esta página só mostra a sinopse por enquanto. Use “Editar página do livro” para escrever o aviso de conteúdo, pôr tags e lojas, contar os bastidores, apresentar personagens, mostrar imagens extras e indicar materiais complementares.</p>' : ''}
    </section>`;
    if (ativa === 'avaliacoes') EL.reviews.mount(root.querySelector('.livro-rev'), { autor, obra: o.id });
    if (extraPedido) document.getElementById(pedida).scrollIntoView({ block: 'start' });
  }

  // link direto para uma aba (obra.html?...#personagens) com a pagina ja aberta
  window.addEventListener('hashchange', () => { if (D) desenhar(); });

  root.addEventListener('click', async (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.aba) { history.replaceState(null, '', '#' + t.dataset.aba); desenhar(); }
    else if (t.dataset.foto) ampliar(Number(t.dataset.foto));
    else if (t.dataset.copiar !== undefined) { try { await navigator.clipboard.writeText(location.origin + location.pathname + location.search); t.innerHTML = '&#10003;'; t.title = 'Link copiado'; } catch { /* sem permissao */ } }
    else if (t.dataset.editar !== undefined) editar();
    else if (t.dataset.denunciar !== undefined) denunciar();
    else if (t.dataset.estante !== undefined) {
      if (!D.logado) return pedirLogin('Estante', 'Entre na sua conta para guardar livros nas suas estantes.');
      estanteDialogo();
    }
    else if (t.dataset.favoritar !== undefined) {
      if (!D.logado) return pedirLogin('Favoritar', 'Entre na sua conta para guardar este livro nos favoritos.');
      t.disabled = true;
      try {
        const r = await api(`/api/livro/${autor}/${obraId}/favorito`, { method: 'POST' });
        D.favorito = r.favorito; D.numeros.favoritos = r.total;
        t.setAttribute('aria-pressed', r.favorito); t.innerHTML = r.favorito ? '&#10084;&#65039;' : '&#129293;';
        t.title = r.favorito ? 'Tirar dos favoritos' : 'Adicionar aos favoritos'; t.setAttribute('aria-label', t.title);
        const n = root.querySelector('[data-num=favoritos]');
        if (n) n.innerHTML = `<b>${milhar(r.total)}</b><span>${r.total === 1 ? 'favorito' : 'favoritos'}</span>`;
      } catch { /* mantem como estava */ }
      t.disabled = false;
    }
    else if (t.dataset.curtir) {
      if (!D.logado) return pedirLogin('Curtir', 'Entre na sua conta para curtir os extras do autor.');
      t.disabled = true;
      try {
        const r = await api(`/api/livro/posts/${t.dataset.curtir}/curtir`, { method: 'POST' });
        Object.assign(D.posts.find((x) => String(x.id) === t.dataset.curtir), { curti: r.curti, curtidas: r.curtidas });
        t.setAttribute('aria-pressed', r.curti); t.innerHTML = `${r.curti ? '&#10084;&#65039;' : '&#129293;'} <span>${r.curtidas}</span>`;
      } catch { /* mantem como estava */ }
      t.disabled = false;
    }
    else if (t.dataset.revelar !== undefined) { t.parentElement.classList.remove('spoiler'); t.remove(); }
    else if (t.dataset.comentar) {
      const box = t.closest('.extra').querySelector('.extra-comentarios');
      if (!box.hidden) { box.hidden = true; box.replaceChildren(); } else comentar(t.dataset.comentar, box);
    }
    else if (t.dataset.publicar !== undefined) publicarExtra(t.closest('form'));
    else if (t.dataset.tirarimg !== undefined) { novaImagem = ''; const b = t.closest('.extra-novo-img'); b.hidden = true; b.replaceChildren(); }
    else if (t.dataset.apagar) {
      const d = janela('Apagar este extra?', el('<p>O texto, a imagem e as curtidas somem. Os comentários do Disqus ficam guardados lá.</p>'), [botao('Cancelar', 'btn-ghost', () => d.close()), botao('Apagar', 'btn-primary', async () => {
        try { D.posts = (await api(`/api/livro/${obraId}/posts/${t.dataset.apagar}`, { method: 'DELETE' })).posts; d.close(); desenhar(); } catch (err) { d.close(); }
      })]);
    }
  });

  // imagem do novo extra: envia ja na escolha e mostra a previa
  root.addEventListener('change', async (e) => {
    const t = e.target;
    if (t.dataset.upextra === undefined || !t.files[0]) return;
    const f = t.closest('form'), estado = f.querySelector('.el-estado'), prev = f.querySelector('.extra-novo-img');
    estado.innerHTML = '<p class="note ok">Enviando a imagem...</p>';
    try {
      novaImagem = await EL.enviarImagem(t.files[0]);
      prev.innerHTML = `<img src="${esc(imgUrl(novaImagem))}" alt=""><button type="button" class="rm" data-tirarimg>Tirar imagem</button>`;
      prev.hidden = false; estado.innerHTML = '';
    } catch (err) { estado.innerHTML = `<p class="note err">${esc(err.message)}</p>`; }
    t.value = '';
  });

  function janela(titulo, corpo, rodape, largo) {
    const dlg = document.createElement('dialog');
    dlg.className = 'el-dialogo' + (largo ? ' largo' : '');
    dlg.innerHTML = `<h2>${esc(titulo)}</h2><div class="el-dialogo-corpo"></div><div class="el-dialogo-rodape"></div>`;
    dlg.querySelector('.el-dialogo-corpo').append(...[].concat(corpo));
    dlg.querySelector('.el-dialogo-rodape').append(...[].concat(rodape));
    dlg.addEventListener('close', () => dlg.remove());
    document.body.append(dlg); dlg.showModal();
    return dlg;
  }
  const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };
  const botao = (rotulo, classe, fn) => { const b = el(`<button type="button" class="btn ${classe}">${esc(rotulo)}</button>`); b.addEventListener('click', fn); return b; };

  function ampliar(n) {
    const i = D.pagina.imagens[n];
    const d = janela(i.legenda || D.obra.titulo, el(`<img class="livro-zoom" src="${esc(imgUrl(i.id))}" alt="${esc(i.legenda)}">`), botao('Fechar', 'btn-ghost', () => d.close()), true);
  }

  // ---------- estante: uma das cinco fixas (Lendo, Quero ler...) e quantas listas proprias quiser ----------
  async function estanteDialogo() {
    let listas;
    try { listas = (await api('/api/estantes')).listas; } catch (err) { return; }
    const corpo = el('<div class="est-dlg"></div>');
    const desenharEst = () => {
      const fixas = listas.filter((l) => l.chave), proprias = listas.filter((l) => !l.chave);
      const naFixa = fixas.find((l) => l.obras.includes(obraId));
      corpo.innerHTML = `<fieldset class="est-fixas"><legend>Situação</legend>
          ${fixas.map((l) => `<label><input type="radio" name="fixa" value="${l.id}" ${naFixa === l ? 'checked' : ''}> ${esc(l.nome)}</label>`).join('')}
          <label><input type="radio" name="fixa" value="" ${naFixa ? '' : 'checked'}> Nenhuma</label></fieldset>
        <fieldset class="est-proprias"><legend>Minhas listas</legend>
          ${proprias.map((l) => `<label><input type="checkbox" value="${l.id}" ${l.obras.includes(obraId) ? 'checked' : ''}> ${esc(l.nome)}</label>`).join('') || '<p class="hint">Você ainda não criou listas.</p>'}
          <form class="est-nova"><input name="nome" maxlength="60" placeholder="Nova lista" aria-label="Nome da nova lista"><button class="btn btn-ghost" type="submit">Criar</button></form></fieldset>
        <div class="el-estado" role="status"></div>`;
    };
    const alternar = async (id) => { listas = (await api(`/api/estantes/${id}/livro`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ autor, obra: obraId }) })).listas; desenharEst(); };
    corpo.addEventListener('change', async (e) => {
      const t = e.target;
      try {
        if (t.name === 'fixa') {
          const atual = listas.find((l) => l.chave && l.obras.includes(obraId));
          if (t.value) await alternar(t.value); else if (atual) await alternar(atual.id);
        } else if (t.type === 'checkbox') await alternar(t.value);
      } catch (err) { corpo.querySelector('.el-estado').innerHTML = `<p class="note err">${esc(err.message)}</p>`; }
    });
    corpo.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = e.target.nome.value.trim(); if (!nome) return;
      try {
        listas = (await api('/api/estantes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome }) })).listas;
        await alternar(listas.filter((l) => !l.chave && l.nome === nome).pop().id);
      } catch (err) { corpo.querySelector('.el-estado').innerHTML = `<p class="note err">${esc(err.message)}</p>`; }
    });
    desenharEst();
    const d = janela('Pôr na estante', corpo, [el('<a class="btn btn-ghost" href="#">Ver minhas estantes</a>'), botao('Pronto', 'btn-primary', () => d.close())]);
    const meu = await api('/api/me').catch(() => null);
    if (meu) d.querySelector('.el-dialogo-rodape a').href = `leitor.html?u=${encodeURIComponent(meu.slug)}`;
  }

  // ---------- denuncia (qualquer conta logada, menos o dono) ----------
  const MOTIVOS = [['plagio', 'Plágio ou cópia de outra obra'], ['pirataria', 'Pirataria ou violação de direitos autorais'], ['ia', 'Texto gerado por IA sem aviso'],
    ['classificacao', 'Classificação etária errada'], ['ofensivo', 'Conteúdo ofensivo ou ilegal'], ['spam', 'Spam ou propaganda'], ['outro', 'Outro motivo']];
  function denunciar() {
    if (D.dono) return;
    if (!D.logado) {
      const d = janela('Denunciar este livro', el('<p>Para denunciar, entre na sua conta (leitores podem criar uma conta grátis). Assim a moderação consegue falar com você se precisar.</p>'),
        [botao('Fechar', 'btn-ghost', () => d.close()), el('<a class="btn btn-primary" href="conta.html">Entrar</a>')]);
      return;
    }
    const f = el(`<form class="el-form">
      <p class="hint">A denúncia vai para os moderadores do coletivo. O autor fica sabendo do motivo, mas não de quem denunciou.</p>
      <div class="fld"><span>Motivo</span><div class="den-motivos">${MOTIVOS.map(([v, r]) => `<label><input type="radio" name="motivo" value="${v}"> ${esc(r)}</label>`).join('')}</div></div>
      <label class="fld"><span>O que está acontecendo?</span><textarea name="detalhe" rows="4" maxlength="1000" placeholder="Para plágio ou pirataria: qual obra foi copiada, que partes, como você sabe."></textarea></label>
      <label class="fld"><span>Link do original (opcional)</span><input name="link" type="url" maxlength="300" placeholder="https://..."></label>
      <div class="el-estado" role="status"></div></form>`);
    f.addEventListener('submit', (e) => e.preventDefault());
    const estado = f.querySelector('.el-estado');
    const enviar = botao('Enviar denúncia', 'btn-primary', async () => {
      if (!f.motivo.value) { estado.innerHTML = '<p class="note err">Escolha o motivo.</p>'; return; }
      enviar.disabled = true;
      try {
        await api(`/api/livro/${autor}/${obraId}/denuncia`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ motivo: f.motivo.value, detalhe: f.detalhe.value, link: f.link.value }) });
        dlg.close();
        const d = janela('Denúncia enviada', el('<p>Obrigado. Os moderadores vão analisar e tomar as providências necessárias.</p>'), botao('Fechar', 'btn-ghost', () => d.close()));
      } catch (err) { estado.innerHTML = `<p class="note err">${esc(err.message)}</p>`; enviar.disabled = false; }
    });
    const dlg = janela('Denunciar este livro', f, [botao('Cancelar', 'btn-ghost', () => dlg.close()), enviar]);
  }

  // ---------- edicao (so o dono) ----------
  function editar() {
    const p = JSON.parse(JSON.stringify(D.pagina));
    const f = el(`<form class="el-form livro-ed">
      <label class="fld"><span>Títulos alternativos (outros idiomas, título original...)</span><input name="alt" maxlength="200" value="${esc(p.alt_titulos)}"></label>
      <label class="fld"><span>Aviso de conteúdo (opcional)</span><input name="aviso" maxlength="300" value="${esc(p.aviso || '')}" placeholder="Ex.: cenas de violência, morte e temas sensíveis"><small class="hint">Aparece no topo da página, junto da faixa etária.</small></label>
      <label class="fld"><span>Tags (separadas por vírgula, até 12)</span><input name="tags" maxlength="400" value="${esc(p.tags.join(', '))}" placeholder="Ex.: suspense, mistério, ficção científica"></label>
      <fieldset class="blk"><legend>Disponível em: lojas (até 6)</legend><p class="hint">Amazon, Google Play, Uiclap, Kobo... Aparecem no topo da página, junto do link de compra do perfil.</p><div data-lista="lojas"></div><button type="button" class="btn btn-ghost" data-add="lojas">Adicionar loja</button></fieldset>
      <label class="fld"><span>Bastidores</span><textarea name="contexto" rows="5" maxlength="4000" placeholder="Como a história nasceu, inspirações, curiosidades, prêmios...">${esc(p.contexto)}</textarea></label>
      <label class="fld"><span>Estilo e tom</span><textarea name="estilo" rows="3" maxlength="1500" placeholder="Ex.: narrador em primeira pessoa, capítulos curtos, tom sombrio com humor...">${esc(p.estilo)}</textarea></label>
      <fieldset class="blk"><legend>Personagens (até 16)</legend><div data-lista="personagens"></div><button type="button" class="btn btn-ghost" data-add="personagens">Adicionar personagem</button></fieldset>
      <fieldset class="blk"><legend>Galeria: imagens extras (até 12)</legend><p class="hint">Mapas, ilustrações, artes de personagens, bastidores. JPG, PNG ou WebP.</p><div data-lista="imagens" class="ed-galeria"></div><label class="btn btn-ghost ed-up">Enviar imagem<input type="file" accept="image/jpeg,image/png,image/webp" data-upgaleria hidden></label></fieldset>
      <fieldset class="blk"><legend>Materiais complementares (até 10)</legend><p class="hint">Links para glossário, mapa interativo, trilha sonora, entrevistas, extras...</p><div data-lista="materiais"></div><button type="button" class="btn btn-ghost" data-add="materiais">Adicionar material</button></fieldset>
      <div class="el-estado" role="status"></div>
    </form>`);
    const estado = f.querySelector('.el-estado');
    const avisar = (t, ok) => { estado.innerHTML = `<p class="note ${ok ? 'ok' : 'err'}">${esc(t)}</p>`; };
    const LIM = { personagens: 16, imagens: 12, materiais: 10, lojas: 6 };
    const desenharListas = () => {
      f.querySelector('[data-lista=personagens]').innerHTML = p.personagens.map((c, i) => `<div class="item ed-pers">
          <div class="pers-foto">${c.imagem ? `<img src="${esc(imgUrl(c.imagem))}" alt="">` : '<span>foto</span>'}</div>
          <div class="ed-campos">
            <label class="fld"><span>Nome</span><input data-k="personagens.${i}.nome" maxlength="80" value="${esc(c.nome)}"></label>
            <label class="fld"><span>Papel</span><input data-k="personagens.${i}.papel" maxlength="60" value="${esc(c.papel)}" placeholder="Protagonista, antagonista, mentora..."></label>
            <label class="fld"><span>Descrição</span><textarea data-k="personagens.${i}.descricao" rows="3" maxlength="800">${esc(c.descricao)}</textarea></label>
            <label class="btn btn-ghost ed-up">${c.imagem ? 'Trocar foto' : 'Enviar foto'}<input type="file" accept="image/jpeg,image/png,image/webp" data-upfoto="${i}" hidden></label>
            <button type="button" class="rm" data-rm="personagens.${i}">Remover personagem</button>
          </div></div>`).join('');
      f.querySelector('[data-lista=imagens]').innerHTML = p.imagens.map((im, i) => `<div class="ed-img">
          <img src="${esc(imgUrl(im.id))}" alt="">
          <input data-k="imagens.${i}.legenda" maxlength="120" value="${esc(im.legenda)}" placeholder="Legenda" aria-label="Legenda da imagem">
          <button type="button" class="rm" data-rm="imagens.${i}">Remover</button></div>`).join('');
      f.querySelector('[data-lista=materiais]').innerHTML = p.materiais.map((m, i) => `<div class="item">
          <label class="fld"><span>Nome</span><input data-k="materiais.${i}.rotulo" maxlength="80" value="${esc(m.rotulo)}" placeholder="Ex.: Glossário"></label>
          <label class="fld"><span>Link (https://...)</span><input data-k="materiais.${i}.url" type="url" maxlength="300" value="${esc(m.url)}"></label>
          <label class="fld"><span>Descrição curta</span><input data-k="materiais.${i}.descricao" maxlength="200" value="${esc(m.descricao)}"></label>
          <button type="button" class="rm" data-rm="materiais.${i}">Remover material</button></div>`).join('');
      f.querySelector('[data-lista=lojas]').innerHTML = p.lojas.map((l, i) => `<div class="item">
          <label class="fld"><span>Loja</span><input data-k="lojas.${i}.rotulo" maxlength="40" value="${esc(l.rotulo)}" placeholder="Ex.: Google Play"></label>
          <label class="fld"><span>Link (https://...)</span><input data-k="lojas.${i}.url" type="url" maxlength="300" value="${esc(l.url)}"></label>
          <button type="button" class="rm" data-rm="lojas.${i}">Remover loja</button></div>`).join('');
      for (const k of ['personagens', 'materiais', 'lojas']) f.querySelector(`[data-add=${k}]`).hidden = p[k].length >= LIM[k];
      f.querySelector('.ed-up:has([data-upgaleria])').hidden = p.imagens.length >= LIM.imagens;
    };
    desenharListas();
    f.addEventListener('submit', (e) => e.preventDefault());
    f.addEventListener('input', (e) => {
      const k = e.target.dataset.k; if (!k) return;
      const [lista, i, campo] = k.split('.'); p[lista][Number(i)][campo] = e.target.value;
    });
    f.addEventListener('click', (e) => {
      const t = e.target;
      if (t.dataset.add === 'personagens') { p.personagens.push({ nome: '', papel: '', descricao: '', imagem: '' }); desenharListas(); }
      else if (t.dataset.add === 'materiais') { p.materiais.push({ rotulo: '', url: '', descricao: '' }); desenharListas(); }
      else if (t.dataset.add === 'lojas') { p.lojas.push({ rotulo: '', url: '' }); desenharListas(); }
      else if (t.dataset.rm) { const [lista, i] = t.dataset.rm.split('.'); p[lista].splice(Number(i), 1); desenharListas(); }
    });
    f.addEventListener('change', async (e) => {
      const t = e.target; if (t.type !== 'file' || !t.files[0]) return;
      avisar('Enviando a imagem...', true);
      try {
        const id = await EL.enviarImagem(t.files[0]);
        if (t.dataset.upgaleria !== undefined) p.imagens.push({ id, legenda: '' });
        else p.personagens[Number(t.dataset.upfoto)].imagem = id;
        desenharListas(); avisar('Imagem enviada. Clique em Salvar para publicar.', true);
      } catch (err) { avisar(err.message); }
    });
    const salvar = botao('Salvar', 'btn-primary', async () => {
      p.alt_titulos = f.alt.value; p.aviso = f.aviso.value; p.tags = f.tags.value.split(','); p.contexto = f.contexto.value; p.estilo = f.estilo.value;
      salvar.disabled = true; avisar('Salvando...', true);
      try {
        const r = await api(`/api/livro/${obraId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: p }) });
        D.pagina = r.pagina; dlg.close(); desenhar();
      } catch (err) { avisar(err.message); salvar.disabled = false; }
    });
    const dlg = janela('Página do livro', f, [botao('Cancelar', 'btn-ghost', () => dlg.close()), salvar], true);
  }
})();
</script>
</body>
</html>
