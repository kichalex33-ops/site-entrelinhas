<script src="common.js"></script>
<script>
(async function(){
  const { esc, api } = EL;
  const root = document.getElementById('chatRoot');
  let last = 0, timer = null, busy = false;

  const hora = (s) => new Date(s * 1000).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const msgHtml = (m) => `
    <div class="chat-msg${m.meu ? ' mine' : ''}" data-id="${m.id}">
      <div class="chat-meta"><b>${esc(m.autor)}</b> <span>${esc(hora(m.em))}</span>
        <button type="button" class="chat-del" data-del="${m.id}" title="Apagar mensagem" aria-label="Apagar mensagem">apagar</button></div>
      <p>${esc(m.texto).replace(/\n/g, '<br>')}</p>
    </div>`;

  function shell(){
    root.innerHTML = `
      <div class="chat-box">
        <div class="chat-log" id="log" aria-live="polite"></div>
        <form class="chat-form" id="form" autocomplete="off">
          <textarea id="txt" rows="2" maxlength="1000" placeholder="Escreva uma mensagem (Enter envia, Shift+Enter quebra a linha)" required></textarea>
          <button class="btn btn-primary" type="submit">Enviar</button>
        </form>
        <p class="chat-note" id="note"></p>
      </div>`;
    const form = document.getElementById('form'), txt = document.getElementById('txt'), log = document.getElementById('log');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const texto = txt.value.trim();
      if (!texto) return;
      txt.disabled = true;
      try {
        await api('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texto }) });
        txt.value = '';
        await poll();
      } catch (er) { document.getElementById('note').textContent = er.message; }
      txt.disabled = false; txt.focus();
    });
    txt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
    log.addEventListener('click', async (e) => {
      const id = e.target && e.target.dataset && e.target.dataset.del;
      if (!id || !confirm('Apagar esta mensagem para todos os moderadores?')) return;
      try {
        await api('/api/chat/' + encodeURIComponent(id), { method: 'DELETE' });
        const el = log.querySelector(`[data-id="${CSS.escape(id)}"]`); if (el) el.remove();
      } catch (er) { document.getElementById('note').textContent = er.message; }
    });
  }

  async function poll(){
    if (busy) return; busy = true;
    try {
      const r = await api('/api/chat?after=' + last);
      const log = document.getElementById('log');
      if (r.messages.length) {
        const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80 || !last;
        log.insertAdjacentHTML('beforeend', r.messages.map(msgHtml).join(''));
        last = r.messages[r.messages.length - 1].id;
        if (stick) log.scrollTop = log.scrollHeight;
      } else if (!last && !log.children.length) {
        log.innerHTML = '<p class="muted-note">Nenhuma mensagem ainda. Comece a conversa.</p>';
      }
      document.getElementById('note').textContent = '';
    } catch (er) {
      document.getElementById('note').textContent = 'Sem conexão com o chat. Tentando de novo...';
    } finally { busy = false; }
  }
  const loop = () => { clearTimeout(timer); timer = setTimeout(async () => { if (!document.hidden) await poll(); loop(); }, 5000); };

  try {
    const me = await api('/api/me');
    if (!me.mod) { root.innerHTML = '<p class="muted-note">Esta página é exclusiva dos moderadores.</p>'; return; }
    shell(); await poll(); loop();
  } catch (e) {
    root.innerHTML = '<p class="muted-note"><a href="conta.html">Entre</a> com uma conta de moderador para ver o chat.</p>';
  }
})();
</script>
</body>
</html>
