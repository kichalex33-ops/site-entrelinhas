# Deploy no Cloudflare a cada push na main: aplica as migracoes do D1 e publica o Worker.
# Precisa de dois segredos no GitHub (Settings > Secrets and variables > Actions), da conta Cloudflare do Entrelinhas:
#   CLOUDFLARE_API_TOKEN   token com permissao "Edit Cloudflare Workers" + "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  ID da conta (aparece na lateral do painel do Cloudflare)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-producao

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Migracoes do banco (remoto)
        run: npx wrangler d1 migrations apply entrelinhas-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
      - name: Publicar o Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
